server {
    listen 80;
    root /usr/share/nginx/html;

    # Backend 50 MB'a kadar kabul ediyor; 14B ile bir cevap iki dakikayı geçebiliyor.
    client_max_body_size 60m;
    proxy_read_timeout 600s;

    location ~ ^/(documents|search|answer) {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
