services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama

  # Modelleri ilk açılışta indirir; volume'da varsa hızlıca biter.
  models:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:14b-instruct-q4_K_M}
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull bge-m3 && ollama pull $$LLM_MODEL"]

  backend:
    build: .
    depends_on:
      models:
        condition: service_completed_successfully
    environment:
      # Bilgisayardaki Ollama için: DOCKER_OLLAMA_URL=http://host.docker.internal:11434
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:14b-instruct-q4_K_M}
    volumes:
      - data:/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  ollama:
  data:
