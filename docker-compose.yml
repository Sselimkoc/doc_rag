services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama

  backend:
    build: .
    environment:
      # Bilgisayardaki Ollama için: DOCKER_OLLAMA_URL=http://host.docker.internal:11434
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:14b-instruct-q4_K_M}
    volumes:
      - data:/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  ollama:
  data:
